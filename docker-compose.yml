services:
  battery-monitor:
    build: .
    container_name: battery-monitor
    restart: unless-stopped
    # Контейнер пишет в ./data на хосте, поэтому должен работать под вашим UID.
    # По умолчанию 1000:1000; если `id -u` даёт другое — задайте APP_UID/APP_GID в .env.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    pull_policy: build   # собирать локально, не пытаться тянуть из реестра
    ports:
      # Только loopback: снаружи хоста порт недоступен, ходить через реверс-прокси.
      # Для доступа из LAN без прокси замените на "8000:8000".
      - "127.0.0.1:8000:8000"
    env_file:
      # .env необязателен: без него работает демо-режим (реквизиты не заданы)
      - path: .env
        required: false
    volumes:
      # Постоянные настройки из админ-панели (settings.json) — прямо в папке проекта,
      # чтобы их было видно и можно было забэкапить. Каталог в .gitignore.
      - ./data:/data
      # Необязательный bootstrap-список устройств (config/devices.yml.example)
      - ./config:/config:ro
    environment:
      # Всё можно настроить в веб-панели /admin. Значения ниже — только для
      # первого запуска (bootstrap); после сохранения в панели приоритет у /data.
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TUYA_ACCESS_ID: ${TUYA_ACCESS_ID:-}
      TUYA_ACCESS_KEY: ${TUYA_ACCESS_KEY:-}
      TUYA_DEVICE_ID: ${TUYA_DEVICE_ID:-}
      TUYA_API_ENDPOINT: ${TUYA_API_ENDPOINT:-https://openapi.tuyaeu.com}
      DEVICES_CONFIG: ${DEVICES_CONFIG:-/config/devices.yml}
      POLL_INTERVAL: ${POLL_INTERVAL:-10}
      DEMO_MODE: ${DEMO_MODE:-false}
