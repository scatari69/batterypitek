<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery Monitor · устройства</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><g fill='%234fe3c1'><rect x='0' y='1' width='6' height='1'/><rect x='0' y='6' width='6' height='1'/><rect x='0' y='2' width='1' height='4'/><rect x='5' y='2' width='1' height='4'/><rect x='6' y='3' width='1' height='2'/><rect x='1' y='3' width='3' height='2'/></g></svg>">
<link rel="stylesheet" href="/static/pixel.css">
<script src="/static/theme.js"></script>
<style>
  .page { max-width:1120px; margin:0 auto; padding:26px 20px 40px; }

  /* ---------------------------------------------------------- Шапка -- */
  header { display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:16px 18px; margin-bottom:22px; }
  header .logo { color:var(--teal); display:flex; }
  h1 { margin:0; font-size:17px; font-weight:700; letter-spacing:.20em;
    text-transform:uppercase; }
  header .sub { margin-top:3px; }
  header .spacer { flex:1; }
  .badge { padding:4px 8px; background:var(--amber); color:var(--void);
    font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }

  /* ---------------------------------------------------------- Список -- */
  .panel { padding:0; }
  .thead, .row { display:grid; align-items:center; gap:14px;
    grid-template-columns:8px minmax(140px,1.6fr) minmax(96px,1.1fr) 76px 104px minmax(104px,1fr) minmax(112px,.9fr);
    padding:10px 16px; }
  .thead { padding-top:12px; padding-bottom:8px; }
  .thead span:nth-child(4) { text-align:right; }
  .thead span:last-child { text-align:right; }

  .row { text-decoration:none; color:inherit; }
  .row + .row { background-image:linear-gradient(90deg,var(--edge) 0 4px,transparent 4px 8px);
    background-size:8px var(--px); background-repeat:repeat-x; }
  .row:hover { background-color:var(--panel-2); }
  .row:focus-visible { outline-offset:calc(-1*var(--px)); }

  .name b { display:block; font-size:14px; font-weight:700; line-height:1.3; }
  .name i { display:block; font-style:normal; font-size:10.5px; color:var(--dim);
    letter-spacing:.04em; margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .soc { text-align:right; line-height:0; }
  .soc .dash { font-size:16px; color:var(--dim); line-height:1; }

  .state { display:flex; align-items:center; gap:7px; font-size:12px;
    letter-spacing:.06em; text-transform:uppercase; }
  .eta { font-size:12px; font-variant-numeric:tabular-nums; }
  .reads { text-align:right; font-size:12px; font-variant-numeric:tabular-nums;
    color:var(--dim); }
  .reads b { color:var(--ink); font-weight:700; }
  .reads span { display:block; }

  .err { grid-column:3 / -1; font-size:12px; color:var(--red);
    display:flex; align-items:center; gap:8px; }
  .row.offline .name b { color:var(--dim); }

  /* ------------------------------------------------------ Состояния -- */
  .empty { padding:52px 20px; text-align:center; }
  .empty p { color:var(--dim); font-size:13px; margin:0 0 18px; }
  .empty .big { color:var(--ink); font-size:14px; letter-spacing:.1em;
    text-transform:uppercase; font-weight:700; margin-bottom:10px; }

  .statusbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    margin-top:14px; padding:0 4px; }

  /* --------------------------------------------------------- Мобильно -- */
  @media (max-width:900px) {
    .thead { display:none; }
    .row { grid-template-columns:8px 1fr auto; gap:8px 12px;
      grid-template-areas:"led name soc" "led meter meter" "led state eta" "led reads reads";
      padding:14px 16px; }
    .row .led { grid-area:led; align-self:start; margin-top:6px; }
    .row .name { grid-area:name; } .row .soc { grid-area:soc; }
    .row .batt { grid-area:meter; } .row .state { grid-area:state; }
    .row .eta { grid-area:eta; text-align:right; } .row .reads { grid-area:reads; text-align:left; }
    .row .reads span { display:inline; margin-right:14px; }
    .row .err { grid-column:2 / -1; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="px-box raised">
    <span class="logo" id="logo"></span>
    <div>
      <h1>Battery Monitor</h1>
      <div class="sub label" id="sub">инициализация…</div>
    </div>
    <span class="spacer"></span>
    <span class="badge" id="demoBadge" hidden>Демо</span>
    <span data-theme-picker></span>
    <a class="btn" href="/admin">Настройки</a>
  </header>

  <div class="panel px-box raised">
    <div class="thead" id="thead">
      <span></span>
      <span class="label">Устройство</span>
      <span class="label">Заряд</span>
      <span></span>
      <span class="label">Режим</span>
      <span class="label">До 30 %</span>
      <span class="label">Напряжение · ток</span>
    </div>
    <div class="rule"></div>
    <div id="list"></div>
    <div class="empty" id="empty" hidden></div>
  </div>

  <div class="statusbar label">
    <span id="upd">опрос…</span><span class="cursor" id="cursor"></span>
    <span class="spacer"></span>
    <span id="footer"></span>
  </div>
</div>

<script src="/static/pixel.js"></script>
<script>
const $ = id => document.getElementById(id);
let pollInterval = 15;

function etaCell(dev) {
  if (dev.state === "charging") return `<span class="eta t-charge">идёт заряд</span>`;
  const note = dev.eta_note;
  if (note === "at_or_below") return `<span class="eta t-warn">уже ≤ 30 %</span>`;
  if (note === "ok") {
    const d = fmtDuration(dev.eta_minutes);
    return `<span class="eta">${d ? "≈ " + d : "—"}</span>`;
  }
  if (note === "not_discharging") return `<span class="eta t-dim">разряд не идёт</span>`;
  if (note === "no_data") return `<span class="eta t-dim">нет ёмкости</span>`;
  return `<span class="eta t-dim">—</span>`;
}

function row(dev) {
  const href = `/device/${encodeURIComponent(dev.id)}`;
  const name = `<span class="name"><b>${escapeHtml(dev.name)}</b><i>${escapeHtml(dev.id)}</i></span>`;

  if (!dev.online) {
    return `<a class="row offline" href="${href}">
      <span class="led off"></span>${name}
      <span class="err t-low">${pixelSprite("offline")} ${escapeHtml(dev.error || "нет связи")}</span></a>`;
  }

  const soc = typeof dev.soc === "number" ? Math.max(0, Math.min(100, dev.soc)) : null;
  const lvl = soc == null ? "dim" : socLevel(soc);
  const st = PX_STATE[dev.state] || PX_STATE.unknown;

  return `<a class="row" href="${href}">
    <span class="led on"></span>
    ${name}
    <span class="batt">
      <span class="meter"><i class="lvl-${lvl === "dim" ? "ok" : lvl}"
        style="width:${soc == null ? 0 : soc}%"></i></span><span class="nub"></span>
    </span>
    <span class="soc t-${lvl}">${soc == null ? '<span class="dash">—</span>'
      : pixelText(Math.round(soc) + "%", { scale: 3 })}</span>
    <span class="state ${st.cls}">${pixelSprite(st.sprite)}${st.label}</span>
    ${etaCell(dev)}
    <span class="reads">
      <span><b>${fmtNum(dev.voltage, dev.voltage_unit || "V")}</b></span>
      <span><b>${fmtNum(dev.current, dev.current_unit || "A")}</b></span>
    </span></a>`;
}

async function loadConfig() {
  try {
    const c = await (await fetch("/api/config")).json();
    BMTheme.setDefault(c.theme);
    pollInterval = Math.max(10, c.poll_interval || 15);
    $("demoBadge").hidden = !c.demo_mode;
    const n = (c.devices || []).length;
    $("sub").textContent = `${n} ${plural(n, "устройство", "устройства", "устройств")} · ${new URL(c.endpoint).host}`;
  } catch (e) { $("sub").textContent = "сервер не отвечает"; }
}

function showEmpty() {
  $("thead").hidden = true;
  $("empty").hidden = false;
  $("empty").innerHTML = `<div class="big">Батарей пока нет</div>
    <p>Добавьте устройства в настройках — или включите демо-режим, чтобы<br>
       посмотреть, как это выглядит с данными.</p>
    <a class="btn primary" href="/admin">Открыть настройки</a>`;
}

async function tick() {
  try {
    const data = await (await fetch("/api/devices")).json();
    const list = data.devices || [];
    if (!list.length) { showEmpty(); $("list").innerHTML = ""; }
    else {
      $("empty").hidden = true;
      $("thead").hidden = false;
      $("list").innerHTML = list.map(row).join("");
    }
    $("upd").textContent = "обновлено " + new Date(data.timestamp || Date.now()).toLocaleTimeString("ru-RU");
    $("footer").textContent = data.demo ? "данные сгенерированы" : "";
    $("cursor").style.background = "var(--teal)";
  } catch (e) {
    $("upd").textContent = "нет ответа от сервера";
    $("cursor").style.background = "var(--red)";
  } finally {
    setTimeout(tick, pollInterval * 1000);
  }
}

$("logo").innerHTML = pixelBattery(2);
(async function init() { await loadConfig(); tick(); })();
</script>
</body>
</html>
