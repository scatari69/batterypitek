<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="admin.title">Battery Monitor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><g fill='%234fe3c1'><rect x='0' y='1' width='6' height='1'/><rect x='0' y='6' width='6' height='1'/><rect x='0' y='2' width='1' height='4'/><rect x='5' y='2' width='1' height='4'/><rect x='6' y='3' width='1' height='2'/><rect x='1' y='3' width='3' height='2'/></g></svg>">
<link rel="stylesheet" href="/static/pixel.css">
<script src="/static/i18n.js"></script>
<script src="/static/theme.js"></script>
<style>
  .page { max-width:780px; margin:0 auto; padding:26px 20px 120px; }

  .back { display:inline-flex; align-items:center; gap:8px; margin-bottom:14px;
    font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:700;
    color:var(--dim); text-decoration:none; }
  .back:hover { color:var(--teal); }
  header { display:flex; align-items:center; gap:14px; margin-bottom:20px;
    padding:16px 18px; }
  header h1 { font-size:16px; margin:0; font-weight:700; letter-spacing:.16em;
    text-transform:uppercase; }
  .linkbtn { background:none; border:0; color:var(--dim); cursor:pointer; font:inherit;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; }
  .linkbtn:hover { color:var(--red); }

  /* Пиксельная рамка для панелей (та же, что в .px-box). */
  header, .card, .overlay .box {
    background:var(--panel);
    box-shadow:0 calc(-1*var(--px)) var(--edge), 0 var(--px) var(--edge),
               calc(-1*var(--px)) 0 var(--edge), var(--px) 0 var(--edge),
               4px 4px 0 var(--drop);
  }
  .card { padding:18px; margin-bottom:18px; }
  .card h2 { font-size:13px; margin:0 0 6px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; }
  .card .desc { font-size:12px; color:var(--dim); margin:0 0 16px; line-height:1.55; }

  label { display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--dim); font-weight:700; margin:14px 0 6px; }
  input[type=text], input[type=password], input[type=number], select {
    width:100%; padding:9px 11px; font:inherit; font-size:13px; color:var(--ink);
    background:var(--panel-2); border:0; box-shadow:inset 0 0 0 var(--px) var(--edge); }
  input:focus, select:focus { outline:var(--px) solid var(--teal); outline-offset:calc(-1*var(--px)); }
  select { appearance:none; padding-right:28px;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
                     linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 16px) 16px, calc(100% - 10px) 16px;
    background-size:6px 6px, 6px 6px; background-repeat:no-repeat; }
  .row { display:flex; gap:10px; align-items:center; }
  .row.wrap { flex-wrap:wrap; }
  .hint { font-size:11px; color:var(--dim); margin-top:6px; line-height:1.5; }

  .toggle { display:flex; align-items:center; gap:10px; margin-top:14px; }
  .toggle input[type=checkbox] { width:16px; height:16px; accent-color:var(--teal); flex:0 0 auto; }
  .toggle input[type=number] { width:78px; flex:0 0 auto; padding:5px 8px; }
  .toggle .t { font-size:12.5px; }

  .result { font-size:12px; margin-top:14px; padding:10px 12px; display:none;
    background:var(--panel-2); }
  .result.show { display:block; }
  .result.ok { color:var(--teal); box-shadow:inset 0 0 0 var(--px) var(--teal); }
  .result.err { color:var(--red); box-shadow:inset 0 0 0 var(--px) var(--red); }

  .devrow { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .devrow .nm { flex:1.2; } .devrow .id { flex:1.6; }
  .devrow input { font-size:12px; padding:8px 10px; }
  .icon-btn { background:var(--panel-2); color:var(--dim); border:0; font:inherit;
    width:34px; height:34px; cursor:pointer; flex:0 0 auto; font-size:13px;
    box-shadow:inset 0 0 0 var(--px) var(--edge); }
  .icon-btn:hover { color:var(--red); box-shadow:inset 0 0 0 var(--px) var(--red); }
  .devhdr { display:flex; gap:8px; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--dim); font-weight:700; margin-bottom:8px; padding:0 2px; }
  .devhdr .nm { flex:1.2; } .devhdr .id { flex:1.6; } .devhdr .sp { width:34px; }

  .discover { margin-top:14px; padding-top:14px;
    background-image:linear-gradient(90deg,var(--edge) 0 4px,transparent 4px 8px);
    background-size:8px var(--px); background-repeat:repeat-x; }
  .disc-item { display:flex; align-items:center; gap:10px; padding:10px 0;
    background-image:linear-gradient(90deg,var(--edge) 0 4px,transparent 4px 8px);
    background-size:8px var(--px); background-repeat:repeat-x;
    background-position:bottom left; }
  .disc-item:last-child { background-image:none; }
  .disc-item .dn { font-size:12.5px; font-weight:700; }
  .disc-item .di { font-size:11px; color:var(--dim); }
  .disc-item .st { font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    padding:3px 7px; background:var(--panel-2); }
  .disc-item .st.on { color:var(--teal); } .disc-item .st.off { color:var(--dim); }

  .warn-banner { padding:12px 15px; font-size:12px; margin-bottom:18px;
    display:flex; gap:12px; align-items:center; color:var(--amber);
    background:var(--panel); box-shadow:inset 0 0 0 var(--px) var(--amber); }

  .savebar { position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--panel); padding:12px 20px;
    box-shadow:0 calc(-1*var(--px)) var(--edge); }
  .savebar .inner { max-width:780px; margin:0 auto; display:flex; align-items:center; gap:14px; }
  .savebar .msg { font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    font-weight:700; color:var(--dim); }

  /* Логин */
  .overlay { position:fixed; inset:0; background:var(--void); display:flex;
    align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay .box { padding:24px; width:100%; max-width:360px; }
  .overlay h2 { margin:0 0 6px; font-size:14px; letter-spacing:.14em; text-transform:uppercase; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="page" id="panel">
  <a class="back" href="/" data-i18n="admin.back">← К дашборду</a>
  <header>
    <h1 data-i18n="admin.heading">Настройки</h1>
    <div class="spacer"></div>
    <span data-lang-picker></span>
    <span data-theme-picker></span>
    <button class="linkbtn hidden" id="logoutBtn" onclick="logout()"
      data-i18n="admin.logout">Выйти</button>
  </header>

  <div class="warn-banner hidden" id="warnBanner">
    <span data-i18n="admin.noPassword">Панель не защищена паролем.</span>
  </div>

  <!-- Подключение Tuya -->
  <div class="card">
    <h2 data-i18n="admin.tuya">Подключение Tuya</h2>
    <p class="desc" data-i18n-html="admin.tuyaDesc"></p>

    <label>Access ID</label>
    <input type="text" id="access_id" autocomplete="off" spellcheck="false"
      data-i18n-ph="admin.accessIdPh">

    <label data-i18n="admin.accessKey">Access Secret</label>
    <input type="password" id="access_key" autocomplete="off">
    <div class="hint" id="keyHint"></div>

    <label data-i18n="admin.region">Регион дата-центра</label>
    <select id="endpoint">
      <option value="https://openapi.tuyaeu.com" data-i18n="admin.regionEu"></option>
      <option value="https://openapi.tuyaus.com" data-i18n="admin.regionUs"></option>
      <option value="https://openapi-ueaz.tuyaus.com" data-i18n="admin.regionUeaz"></option>
      <option value="https://openapi.tuyacn.com" data-i18n="admin.regionCn"></option>
      <option value="https://openapi.tuyain.com" data-i18n="admin.regionIn"></option>
    </select>
    <div class="hint" data-i18n="admin.regionHint"></div>

    <div class="row" style="margin-top:14px">
      <button class="btn" id="testBtn" onclick="testConnection()"
        data-i18n="admin.testBtn">Проверить подключение</button>
    </div>
    <div class="result" id="testResult"></div>
  </div>

  <!-- Устройства -->
  <div class="card">
    <h2 data-i18n="admin.devices">Устройства</h2>
    <p class="desc" data-i18n="admin.devicesDesc"></p>

    <div class="devhdr"><span class="nm" data-i18n="admin.colName">Имя</span>
      <span class="id" data-i18n="admin.colId">Device ID</span><span class="sp"></span></div>
    <div id="devList"></div>

    <div class="row wrap" style="margin-top:12px">
      <button class="btn ghost" onclick="addDeviceRow('','')"
        data-i18n="admin.addManual">+ Добавить вручную</button>
      <button class="btn" id="discoverBtn" onclick="discover()"
        data-i18n="admin.discoverBtn">Найти в аккаунте</button>
    </div>
    <div class="result" id="discoverResult"></div>
    <div class="discover hidden" id="discoverList"></div>
  </div>

  <!-- Общие -->
  <div class="card">
    <h2 data-i18n="admin.general">Общие параметры</h2>
    <label data-i18n="admin.poll">Интервал опроса, секунд</label>
    <input type="number" id="poll_interval" min="3" max="600" style="max-width:160px">
    <div class="toggle">
      <input type="checkbox" id="demo_mode">
      <span class="t" data-i18n="admin.demoMode"></span>
    </div>
  </div>

  <!-- Оформление -->
  <div class="card">
    <h2 data-i18n="admin.appearance">Оформление</h2>
    <p class="desc" data-i18n="admin.appearanceDesc"></p>

    <label data-i18n="admin.themeLabel">Тема по умолчанию</label>
    <select id="theme"></select>
    <div class="hint" data-i18n="admin.themeHint"></div>

    <div class="hint" id="themeLocal"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost hidden" id="themeResetBtn" onclick="BMTheme.reset()"
        data-i18n="admin.themeReset"></button>
    </div>
  </div>

  <!-- Язык -->
  <div class="card">
    <h2 data-i18n="admin.language">Язык</h2>
    <p class="desc" data-i18n="admin.languageDesc"></p>

    <label data-i18n="admin.languageLabel">Язык по умолчанию</label>
    <select id="language"></select>
    <div class="hint" data-i18n="admin.languageHint"></div>

    <div class="hint" id="langLocal"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost hidden" id="langResetBtn" onclick="BMI18n.reset()"
        data-i18n="admin.langReset"></button>
    </div>
  </div>

  <!-- Уведомления -->
  <div class="card">
    <h2 data-i18n="admin.tg">Уведомления в Telegram</h2>
    <p class="desc" data-i18n-html="admin.tgDesc"></p>

    <div class="toggle" style="margin-top:0">
      <input type="checkbox" id="tg_enabled">
      <span class="t" data-i18n="admin.tgEnable"></span>
    </div>

    <label data-i18n="admin.tgToken">Токен бота</label>
    <input type="password" id="tg_bot_token" autocomplete="off" placeholder="123456:AA...">
    <div class="hint" id="tgTokenHint"></div>

    <label data-i18n="admin.tgChat">ID чата</label>
    <div class="row">
      <input type="text" id="tg_chat_id" spellcheck="false" data-i18n-ph="admin.tgChatPh">
      <button class="btn" id="tgChatsBtn" onclick="findChats()"
        data-i18n="admin.tgChatBtn">Определить</button>
    </div>
    <div class="hint" data-i18n="admin.tgChatHint"></div>
    <div class="result" id="tgChatsResult"></div>
    <div class="discover hidden" id="tgChatsList"></div>

    <label data-i18n="admin.tgSoc">Порог заряда, %</label>
    <input type="number" id="tg_soc_threshold" min="1" max="99" style="max-width:160px">
    <div class="hint" data-i18n="admin.tgSocHint"></div>

    <div class="toggle">
      <input type="checkbox" id="tg_notify_low_soc">
      <span class="t" data-i18n="admin.tgLowSoc"></span>
    </div>
    <div class="toggle">
      <input type="checkbox" id="tg_notify_low_eta">
      <span class="t" data-i18n="admin.tgLowEta"></span>
      <input type="number" id="tg_eta_threshold" min="1" max="10080" style="max-width:110px">
    </div>
    <div class="toggle">
      <input type="checkbox" id="tg_notify_recovery">
      <span class="t" data-i18n="admin.tgRecovery"></span>
    </div>
    <div class="toggle">
      <input type="checkbox" id="tg_notify_offline">
      <span class="t" data-i18n="admin.tgOffline"></span>
    </div>

    <div class="row wrap" style="margin-top:14px; align-items:flex-end">
      <div style="flex:1; min-width:180px">
        <label style="margin-top:0" data-i18n="admin.tgCheck"></label>
        <input type="number" id="tg_check_interval" min="15" max="3600">
      </div>
      <div style="flex:1; min-width:180px">
        <label style="margin-top:0" data-i18n="admin.tgRepeat"></label>
        <input type="number" id="tg_repeat_minutes" min="0" max="10080">
      </div>
    </div>
    <div class="hint" data-i18n="admin.tgRepeatHint"></div>

    <div class="row wrap" style="margin-top:14px">
      <button class="btn" id="tgTestBtn" onclick="testTelegram()"
        data-i18n="admin.tgTestBtn">Отправить тестовое сообщение</button>
      <button class="btn ghost" onclick="loadTgLog()" data-i18n="admin.tgLogBtn"></button>
    </div>
    <div class="result" id="tgTestResult"></div>
    <div class="discover hidden" id="tgLog"></div>
  </div>

  <!-- Безопасность -->
  <div class="card">
    <h2 data-i18n="admin.security">Безопасность</h2>
    <p class="desc" id="secDesc" data-i18n="admin.securityDesc"></p>
    <div id="curPwWrap" class="hidden">
      <label data-i18n="admin.pwCurrent">Текущий пароль</label>
      <input type="password" id="cur_pw" autocomplete="off">
    </div>
    <label data-i18n="admin.pwNew">Новый пароль</label>
    <input type="password" id="new_pw" autocomplete="off" data-i18n-ph="admin.pwNewPh">
    <div class="row" style="margin-top:12px">
      <button class="btn" onclick="savePassword()" id="pwBtn"
        data-i18n="admin.pwSave">Сохранить пароль</button>
    </div>
    <div class="result" id="pwResult"></div>
  </div>
</div>

<div class="savebar" id="savebar">
  <div class="inner">
    <button class="btn primary" id="saveBtn" onclick="saveSettings()"
      data-i18n="admin.save">Сохранить настройки</button>
    <span class="msg" id="saveMsg"></span>
  </div>
</div>

<!-- Логин -->
<div class="overlay hidden" id="loginOverlay">
  <div class="box">
    <h2 data-i18n="admin.login">Вход</h2>
    <p class="desc" style="color:var(--muted);font-size:13px" data-i18n="admin.loginDesc"></p>
    <label data-i18n="admin.password">Пароль</label>
    <input type="password" id="login_pw" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="result err" id="loginErr" style="margin-bottom:12px"></div>
    <button class="btn primary" style="width:100%" onclick="doLogin()"
      data-i18n="admin.loginBtn">Войти</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const T = (key, vars) => BMI18n.t(key, vars);
const TOKEN_KEY = "bm_admin_token";
let authEnabled = false;

function token(){ return localStorage.getItem(TOKEN_KEY) || ""; }
function setToken(t){ t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }

async function api(path, method="GET", body=null){
  const opts = { method, headers:{} };
  if (body != null){ opts.headers["Content-Type"]="application/json"; opts.body=JSON.stringify(body); }
  const t = token();
  if (t) opts.headers["Authorization"] = "Bearer " + t;
  const resp = await bmFetch(path, opts);
  if (resp.status === 401){ showLogin(); throw new Error("unauthorized"); }
  const data = await resp.json().catch(()=>({}));
  if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
  return data;
}

function showResult(el, ok, msg){
  el.className = "result show " + (ok ? "ok" : "err");
  el.textContent = msg;
}

/* ---------------- Загрузка настроек ---------------- */
let lastSettings = null;   /* последний ответ — чтобы перерисовать при смене языка */

async function load(){
  let s;
  try { s = await api("/api/admin/settings"); }
  catch(e){ if (e.message === "unauthorized") return; showToast(T("admin.loadError", { msg: e.message })); return; }

  lastSettings = s;
  authEnabled = s.auth_enabled;
  $("loginOverlay").classList.add("hidden");
  $("warnBanner").classList.toggle("hidden", authEnabled);
  $("logoutBtn").classList.toggle("hidden", !authEnabled);
  $("curPwWrap").classList.toggle("hidden", !authEnabled);
  renderSecurity();

  $("access_id").value = s.access_id || "";
  $("access_key").value = "";
  renderKeyHint();
  if (s.endpoint) $("endpoint").value = s.endpoint;
  $("poll_interval").value = s.poll_interval || 10;
  $("demo_mode").checked = !!s.demo_mode;

  BMTheme.setDefault(s.theme);
  $("theme").value = BMTheme.defaultTheme();
  BMI18n.setDefault(s.language);
  $("language").value = BMI18n.defaultLang();

  $("devList").innerHTML = "";
  (s.devices || []).forEach(d => addDeviceRow(d.name, d.id));
  if (!(s.devices||[]).length) addDeviceRow("", "");

  loadTelegram(s.telegram || {});
}

/* Подписи, зависящие и от языка, и от состояния настроек. */
function renderSecurity(){
  $("secDesc").textContent = T(authEnabled ? "admin.securitySet" : "admin.securityNone");
  $("pwBtn").textContent = T(authEnabled ? "admin.pwChange" : "admin.pwSet");
}

function renderKeyHint(){
  const s = lastSettings || {};
  $("access_key").placeholder = s.has_key
    ? T("admin.accessKeySaved", { hint: s.key_hint }) : T("admin.accessKeyPh");
  $("keyHint").textContent = s.has_key ? T("admin.accessKeyHint") : "";
}

/* ---------------- Оформление ---------------- */
/* Список темы по умолчанию сохраняется вместе с остальными настройками,
   а переключатель в шапке меняет оформление только в этом браузере. */
function initTheme(){
  const sel = $("theme");
  BMTheme.CHOICES.forEach(value => sel.add(new Option(BMTheme.label(value), value)));
  sel.value = BMTheme.defaultTheme();
  BMTheme.onChange(renderThemeLocal);
  renderThemeLocal();
}

function renderThemeLocal(){
  const own = BMTheme.override();
  const sel = $("theme");
  [...sel.options].forEach(opt => { opt.textContent = BMTheme.label(opt.value); });
  $("themeLocal").textContent = own
    ? T("admin.themeOwn", { name: BMTheme.label(own) }) : T("admin.themeDefault");
  $("themeResetBtn").classList.toggle("hidden", !own);
}

/* ---------------- Язык ---------------- */
/* Так же, как с темой: список — общая настройка, переключатель в футере — свой. */
function initLang(){
  const sel = $("language");
  BMI18n.CHOICES.forEach(([value, label]) => sel.add(new Option(label, value)));
  sel.value = BMI18n.defaultLang();
  renderLangLocal();
}

function renderLangLocal(){
  const own = BMI18n.override();
  $("langLocal").textContent = own
    ? T("admin.langOwn", { name: BMI18n.langName(own) }) : T("admin.langDefault");
  $("langResetBtn").classList.toggle("hidden", !own);
}

/* ---------------- Уведомления ---------------- */
function renderTgTokenHint(){
  const tg = (lastSettings || {}).telegram || {};
  $("tg_bot_token").placeholder = tg.has_token
    ? T("admin.tgTokenSaved", { hint: tg.token_hint }) : "123456:AA...";
  $("tgTokenHint").textContent = tg.has_token ? T("admin.tgTokenHint") : "";
}

function loadTelegram(tg){
  $("tg_enabled").checked = !!tg.enabled;
  $("tg_bot_token").value = "";
  renderTgTokenHint();
  $("tg_chat_id").value = tg.chat_id || "";
  $("tg_soc_threshold").value = tg.soc_threshold ?? 30;
  $("tg_eta_threshold").value = tg.eta_threshold ?? 60;
  $("tg_check_interval").value = tg.check_interval ?? 60;
  $("tg_repeat_minutes").value = tg.repeat_minutes ?? 0;
  $("tg_notify_low_soc").checked = tg.notify_low_soc !== false;
  $("tg_notify_low_eta").checked = tg.notify_low_eta !== false;
  $("tg_notify_recovery").checked = tg.notify_recovery !== false;
  $("tg_notify_offline").checked = !!tg.notify_offline;
  if (tg.enabled) loadTgLog();
}

function collectTelegram(){
  const tg = {
    enabled: $("tg_enabled").checked,
    chat_id: $("tg_chat_id").value.trim(),
    soc_threshold: parseInt($("tg_soc_threshold").value) || 30,
    eta_threshold: parseInt($("tg_eta_threshold").value) || 60,
    check_interval: parseInt($("tg_check_interval").value) || 60,
    repeat_minutes: parseInt($("tg_repeat_minutes").value) || 0,
    notify_low_soc: $("tg_notify_low_soc").checked,
    notify_low_eta: $("tg_notify_low_eta").checked,
    notify_recovery: $("tg_notify_recovery").checked,
    notify_offline: $("tg_notify_offline").checked,
  };
  const t = $("tg_bot_token").value.trim();
  if (t) tg.bot_token = t;   // пустое поле = оставить сохранённый токен
  return tg;
}

async function testTelegram(){
  const btn = $("tgTestBtn"); btn.disabled = true; btn.textContent = T("admin.tgSending");
  try {
    const data = await api("/api/admin/telegram/test", "POST", {
      bot_token: $("tg_bot_token").value.trim(),
      chat_id: $("tg_chat_id").value.trim(),
    });
    showResult($("tgTestResult"), data.ok, data.message);
  } catch(e){
    if (e.message !== "unauthorized") showResult($("tgTestResult"), false, T("common.error", { msg: e.message }));
  } finally { btn.disabled = false; btn.textContent = T("admin.tgTestBtn"); }
}

async function findChats(){
  const btn = $("tgChatsBtn"); btn.disabled = true; btn.textContent = T("admin.searching");
  const box = $("tgChatsList");
  try {
    const data = await api("/api/admin/telegram/chats", "POST", {
      bot_token: $("tg_bot_token").value.trim(),
    });
    showResult($("tgChatsResult"), data.ok, data.message);
    const chats = data.chats || [];
    box.classList.toggle("hidden", !chats.length);
    box.innerHTML = chats.map(c => `
      <div class="disc-item">
        <div style="flex:1">
          <div class="dn">${escapeAttr(c.title)}</div>
          <div class="di">${escapeAttr(c.id)} · ${escapeAttr(c.type || "")}</div>
        </div>
        <button class="btn ghost" onclick="pickChat('${escapeAttr(c.id)}')">${T("admin.tgChatPick")}</button>
      </div>`).join("");
  } catch(e){
    if (e.message !== "unauthorized") showResult($("tgChatsResult"), false, T("common.error", { msg: e.message }));
  } finally { btn.disabled = false; btn.textContent = T("admin.tgChatBtn"); }
}
function pickChat(id){
  $("tg_chat_id").value = id;
  $("tgChatsList").classList.add("hidden");
  showToast(T("admin.tgChatPicked"));
}

async function loadTgLog(){
  const box = $("tgLog");
  try {
    const data = await api("/api/admin/telegram/log");
    const events = data.events || [];
    if (!events.length){ box.classList.add("hidden"); return; }
    box.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:6px">${T("admin.tgLogTitle")}</div>` +
      events.map(e => `
      <div class="disc-item">
        <div style="flex:1">
          <div class="dn" style="white-space:pre-wrap">${escapeAttr(e.text)}</div>
          <div class="di">${new Date(e.ts).toLocaleString(BMI18n.locale())}${
            e.ok ? "" : escapeAttr(T("admin.tgLogFailed", { msg: e.error }))}</div>
        </div>
        <span class="st ${e.ok?"on":"off"}">${e.ok?"✓":"✕"}</span>
      </div>`).join("");
    box.classList.remove("hidden");
  } catch(e){ /* журнал не критичен */ }
}

/* ---------------- Устройства ---------------- */
function addDeviceRow(name, id){
  const row = document.createElement("div");
  row.className = "devrow";
  row.innerHTML = `
    <input class="nm" type="text" data-i18n-ph="admin.namePh" value="${escapeAttr(name)}">
    <input class="id" type="text" spellcheck="false" placeholder="Device ID" value="${escapeAttr(id)}">
    <button class="icon-btn" data-i18n-title="admin.remove"
      onclick="this.parentElement.remove()">✕</button>`;
  BMI18n.apply(row);
  $("devList").appendChild(row);
}
function collectDevices(){
  return [...document.querySelectorAll("#devList .devrow")].map(r => ({
    name: r.querySelector(".nm").value.trim(),
    id: r.querySelector(".id").value.trim(),
  })).filter(d => d.id);
}
function deviceExists(id){
  return [...document.querySelectorAll("#devList .id")].some(i => i.value.trim() === id);
}
function escapeAttr(s){ return String(s ?? "").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

async function discover(){
  const btn = $("discoverBtn"); btn.disabled = true; btn.textContent = T("admin.searching");
  const res = $("discoverResult"); res.className = "result";
  try {
    const data = await api("/api/admin/discover");
    const list = data.devices || [];
    const box = $("discoverList");
    if (!list.length){ showResult(res, false, T("admin.notFound")); box.classList.add("hidden"); return; }
    box.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:8px">
        <b style="font-size:13px">${T("admin.found", { n: list.length })}</b>
        <button class="btn ghost" onclick="addAllDiscovered()">${T("admin.addAll")}</button></div>` +
      list.map(d => `
      <div class="disc-item" data-id="${escapeAttr(d.id)}" data-name="${escapeAttr(d.name)}">
        <div style="flex:1">
          <div class="dn">${escapeAttr(d.name)}</div>
          <div class="di">${escapeAttr(d.id)}${d.product_name ? " · "+escapeAttr(d.product_name) : ""}</div>
        </div>
        <span class="st ${d.online?"on":"off"}">${T(d.online?"admin.devOnline":"admin.devOffline")}</span>
        <button class="btn ghost" onclick="addDiscovered(this)">${T("admin.add")}</button>
      </div>`).join("");
    box.classList.remove("hidden");
    res.className = "result";
  } catch(e){
    if (e.message !== "unauthorized") showResult(res, false, T("common.error", { msg: e.message }));
  } finally { btn.disabled = false; btn.textContent = T("admin.discoverBtn"); }
}
function addDiscovered(btn){
  const item = btn.closest(".disc-item");
  const id = item.dataset.id, name = item.dataset.name;
  if (deviceExists(id)){ btn.textContent = T("admin.already"); btn.disabled = true; return; }
  addDeviceRow(name, id);
  btn.textContent = T("admin.added"); btn.disabled = true;
}
function addAllDiscovered(){
  document.querySelectorAll("#discoverList .disc-item").forEach(item => {
    if (!deviceExists(item.dataset.id)) addDeviceRow(item.dataset.name, item.dataset.id);
  });
  showToast(T("admin.addedToast"));
}

/* ---------------- Проверка / сохранение ---------------- */
async function testConnection(){
  const btn = $("testBtn"); btn.disabled = true; btn.textContent = T("admin.testing");
  try {
    const data = await api("/api/admin/test-connection", "POST", {
      access_id: $("access_id").value.trim(),
      access_key: $("access_key").value.trim(),
      endpoint: $("endpoint").value,
    });
    showResult($("testResult"), data.ok, data.message);
  } catch(e){
    if (e.message !== "unauthorized") showResult($("testResult"), false, T("common.error", { msg: e.message }));
  } finally { btn.disabled = false; btn.textContent = T("admin.testBtn"); }
}

async function saveSettings(){
  const btn = $("saveBtn"); btn.disabled = true;
  const payload = {
    access_id: $("access_id").value.trim(),
    endpoint: $("endpoint").value,
    poll_interval: parseInt($("poll_interval").value) || 10,
    demo_mode: $("demo_mode").checked,
    theme: $("theme").value,
    language: $("language").value,
    devices: collectDevices(),
    telegram: collectTelegram(),
  };
  const key = $("access_key").value.trim();
  if (key) payload.access_key = key;
  try {
    await api("/api/admin/settings", "POST", payload);
    showToast(T("admin.saved"));
    $("access_key").value = "";
    load();
  } catch(e){
    if (e.message !== "unauthorized") showToast(T("common.error", { msg: e.message }));
  } finally { btn.disabled = false; }
}

async function savePassword(){
  const res = $("pwResult");
  const newPw = $("new_pw").value;
  try {
    const data = await api("/api/admin/password", "POST", {
      current: $("cur_pw").value, new: newPw,
    });
    if (data.token) setToken(data.token);
    $("new_pw").value = ""; $("cur_pw").value = "";
    showResult(res, true, T("admin.pwSaved"));
    load();
  } catch(e){
    if (e.message !== "unauthorized") showResult(res, false, e.message);
  }
}

/* ---------------- Логин ---------------- */
function showLogin(){ $("loginOverlay").classList.remove("hidden"); $("login_pw").focus(); }
async function doLogin(){
  const err = $("loginErr"); err.classList.remove("show");
  try {
    const resp = await bmFetch("/api/admin/login", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ password: $("login_pw").value }),
    });
    const data = await resp.json();
    if (!resp.ok){ err.textContent = data.detail || T("admin.loginError"); err.classList.add("show"); return; }
    setToken(data.token || "");
    $("login_pw").value = "";
    load();
  } catch(e){ err.textContent = T("common.error", { msg: e.message }); err.classList.add("show"); }
}
function logout(){ setToken(""); location.reload(); }

function showToast(msg){ $("saveMsg").textContent = msg; clearTimeout(window._t);
  window._t = setTimeout(()=>{ $("saveMsg").textContent=""; }, 4000); }

/* Сменили язык — обновляем подписи, которые зависят ещё и от состояния настроек.
   Значения полей и несохранённые правки при этом сохраняются. */
BMI18n.onChange(() => {
  renderThemeLocal();
  renderLangLocal();
  renderSecurity();
  renderKeyHint();
  renderTgTokenHint();
  $("saveMsg").textContent = "";
});

initTheme();
initLang();
load();
</script>
</body>
