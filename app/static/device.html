<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="device.title">Battery Monitor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><g fill='%234fe3c1'><rect x='0' y='1' width='6' height='1'/><rect x='0' y='6' width='6' height='1'/><rect x='0' y='2' width='1' height='4'/><rect x='5' y='2' width='1' height='4'/><rect x='6' y='3' width='1' height='2'/><rect x='1' y='3' width='3' height='2'/></g></svg>">
<link rel="stylesheet" href="/static/pixel.css">
<script src="/static/i18n.js"></script>
<script src="/static/theme.js"></script>
<style>
  .page { max-width:1080px; margin:0 auto; padding:26px 20px 40px; }

  .back { display:inline-flex; align-items:center; gap:8px; margin-bottom:14px;
    font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:700;
    color:var(--dim); text-decoration:none; }
  .back:hover { color:var(--teal); }

  header { display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:16px 18px; margin-bottom:18px; }
  header .logo { color:var(--teal); display:flex; }
  h1 { margin:0; font-size:16px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; }
  header .sub { margin-top:3px; }
  .badge { padding:4px 8px; background:var(--amber); color:var(--void);
    font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
  .conn { display:flex; align-items:center; gap:8px; font-size:11px;
    letter-spacing:.1em; text-transform:uppercase; font-weight:700; }

  .error { display:none; padding:12px 16px; margin-bottom:18px; font-size:12.5px;
    color:var(--red); align-items:center; gap:10px; }
  .error.show { display:flex; }

  /* ------------------------------------------------------- Верхний блок -- */
  .top { display:grid; grid-template-columns:minmax(280px,.9fr) 1.6fr; gap:16px; margin-bottom:16px; }
  @media (max-width:820px) { .top { grid-template-columns:1fr; } }

  .charge { padding:18px; display:flex; flex-direction:column; gap:14px; }
  .charge .socline { display:flex; align-items:flex-end; gap:14px; }
  .charge .socline .pxwrap { line-height:0; }
  .charge .state { display:flex; align-items:center; gap:8px; font-size:12px;
    letter-spacing:.08em; text-transform:uppercase; font-weight:700; margin-bottom:4px; }
  .eta { font-size:12.5px; font-variant-numeric:tabular-nums; }
  .eta b { font-weight:700; }
  .caps { display:flex; gap:18px; flex-wrap:wrap; font-size:11.5px; color:var(--dim);
    font-variant-numeric:tabular-nums; padding-top:12px;
    background-image:linear-gradient(90deg,var(--edge) 0 4px,transparent 4px 8px);
    background-size:8px var(--px); background-repeat:repeat-x; }
  .caps b { color:var(--ink); font-weight:700; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(146px,1fr));
    gap:12px; align-content:start; }
  .tile { padding:12px 14px; }
  .tile .v { font-size:21px; font-weight:700; margin-top:6px; font-variant-numeric:tabular-nums;
    letter-spacing:.02em; }
  .tile .v small { font-size:12px; color:var(--dim); font-weight:700; margin-left:3px; }
  .tile .v.pos { color:var(--lime); } .tile .v.neg { color:var(--teal); }

  /* ------------------------------------------------------------ График -- */
  .chart-card { padding:16px 18px 12px; margin-bottom:16px; }
  .chart-head { display:flex; align-items:baseline; gap:12px; margin-bottom:12px; }
  .chart-head .now { margin-left:auto; font-size:15px; font-weight:700;
    font-variant-numeric:tabular-nums; }
  svg.chart { width:100%; height:210px; display:block; touch-action:none; }
  .tooltip { position:fixed; pointer-events:none; z-index:95; padding:6px 9px;
    font-size:11px; opacity:0; transition:opacity .1s; white-space:nowrap;
    background:var(--panel); box-shadow:0 -2px var(--edge),0 2px var(--edge),
      -2px 0 var(--edge),2px 0 var(--edge),3px 3px 0 var(--drop); }
  .tooltip b { font-variant-numeric:tabular-nums; }

  /* ------------------------------------------------------------ Таблицы -- */
  h2.section { margin:22px 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  td { text-align:left; padding:9px 14px;
    background-image:linear-gradient(90deg,var(--edge) 0 4px,transparent 4px 8px);
    background-size:8px var(--px); background-repeat:repeat-x; }
  tr:first-child td { background-image:none; }
  td.code { color:var(--dim); font-size:11px; letter-spacing:.02em; }
  td.val { text-align:right; font-variant-numeric:tabular-nums; font-weight:700;
    white-space:nowrap; }

  .statusbar { display:flex; gap:10px; align-items:center; margin-top:16px; padding:0 4px; }
</style>
</head>
<body>
<div class="page">
  <a class="back" href="/" data-i18n="device.back">← Все устройства</a>

  <header class="px-box raised">
    <span class="logo" id="logo"></span>
    <div>
      <h1 id="devName" data-i18n="device.heading">Устройство</h1>
      <div class="sub label" id="devsub" data-i18n="common.init">инициализация…</div>
    </div>
    <span class="spacer"></span>
    <span class="badge" id="demoBadge" data-i18n="common.demo" hidden>Демо</span>
    <span data-theme-picker></span>
    <span class="conn"><span class="led" id="connDot"></span>
      <span id="connText" data-i18n="device.conn">Опрос…</span></span>
  </header>

  <div class="error px-box" id="errorBox"></div>

  <div class="top">
    <div class="charge px-box raised">
      <span class="label" data-i18n="device.charge">Заряд батареи</span>
      <div class="socline">
        <span class="pxwrap t-ok" id="socNum"></span>
        <div>
          <div class="state" id="statePill"></div>
          <div class="eta" id="etaLine"></div>
        </div>
      </div>
      <div class="batt">
        <span class="meter"><i class="lvl-ok" id="battFill" style="width:0"></i></span><span class="nub"></span>
      </div>
      <div class="caps" id="capLine"></div>
    </div>
    <div class="tiles" id="tiles"></div>
  </div>

  <div class="chart-card px-box raised">
    <div class="chart-head">
      <span class="label" id="chartTitle" data-i18n="device.history">История</span>
      <span class="now" id="chartNow"></span>
    </div>
    <svg class="chart" id="chart" preserveAspectRatio="none"></svg>
  </div>

  <div id="groups"></div>

  <div class="statusbar label">
    <span id="footer" data-i18n="common.polling">опрос…</span><span class="cursor" id="cursor"></span>
    <span class="spacer"></span>
    <span data-lang-picker></span>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script src="/static/pixel.js"></script>
<script>
const $ = id => document.getElementById(id);
const T = (key, vars) => BMI18n.t(key, vars);
const DEVICE_ID = decodeURIComponent((location.pathname.split("/").filter(Boolean).pop()) || "");
const HISTORY_MAX = 90;
let targetSoc = 30;          /* целевой уровень заряда из настроек (админка) */
let history = [];
let pollInterval = 10;
let chartMeta = { unit:"", role:"" };
let lastData = null;         /* последний ответ — чтобы перерисовать при смене языка */

const GROUP_ORDER = ["counter","protection","config","control","other"];
const TILE_PRIORITY = ["cur_voltage","cur_current","cur_power","ntc_temp","cpu_temp"];
const TILE_EXCLUDE = new Set(["battery_percentage","cap","resistance"]);

/* Значения-перечисления из спецификации Tuya — переводим известные. */
function fmt(v, unit) {
  if (v === null || v === undefined) return "—";
  if (typeof v === "boolean") return T(v ? "common.yes" : "common.no");
  if (typeof v === "number") return fmtNum(v, unit);
  const label = T("val." + v);
  return label === "val." + v ? String(v) : label;
}
function num(v, digits = 2) {
  if (typeof v !== "number") return "—";
  return (Number.isInteger(v) ? v : +v.toFixed(digits)).toLocaleString(BMI18n.locale());
}

async function loadConfig() {
  try {
    const c = await (await bmFetch("/api/config")).json();
    BMTheme.setDefault(c.theme);
    BMI18n.setDefault(c.language);
    pollInterval = c.poll_interval || 10;
    if (typeof c.target_soc === "number") targetSoc = c.target_soc;
    $("demoBadge").hidden = !c.demo_mode;
    const dev = (c.devices || []).find(d => d.id === DEVICE_ID);
    if (dev) $("devName").textContent = dev.name;
    $("devsub").textContent = `${DEVICE_ID} · ${new URL(c.endpoint).host}`;
  } catch (e) { $("devsub").textContent = T("common.noServer"); }
}

let conn = { online: false, err: null };

function setConn(online, err) {
  conn = { online, err };
  $("connDot").className = "led " + (online ? "on" : "off");
  $("connText").textContent = T(online ? "device.online" : "device.offline");
  $("connText").className = online ? "t-ok" : "t-low";
  $("errorBox").classList.toggle("show", !!err);
  if (err) $("errorBox").innerHTML = `${pixelSprite("alert", { scale:2 })} ${escapeHtml(err)}`;
  $("cursor").style.background = online ? "var(--teal)" : "var(--red)";
}

function etaText(eta) {
  if (!eta) return "";
  if (eta.note === "at_or_below")
    return `<span class="t-warn">${T("device.etaAtOrBelow", { pct: targetSoc })}</span>`;
  if (eta.note === "not_discharging")
    return `<span class="t-dim">${T("device.etaNotDischarging")}</span>`;
  if (eta.note === "no_data")
    return `<span class="t-dim">${T("device.etaNoData")}</span>`;
  const d = fmtDuration(eta.minutes);
  return d ? T("device.eta", { pct: targetSoc, dur: d }) : "";
}

function tileHtml(m) {
  let cls = "v";
  if (m.role === "current" && typeof m.value === "number") {
    if (m.value > 0.02) cls += " pos"; else if (m.value < -0.02) cls += " neg";
  }
  const val = fmt(m.value, m.unit).replace(/\s(\S+)$/, ' <small>$1</small>');
  return `<div class="tile px-box"><div class="label">${escapeHtml(BMI18n.dp(m.code, m.role))}</div>
          <div class="${cls}">${val}</div></div>`;
}

/* fresh — новый ответ сервера (точку в историю графика добавляем только тогда,
   при перерисовке из-за смены языка график остаётся прежним). */
function render(data, fresh = true) {
  if (typeof data.target_soc === "number") targetSoc = data.target_soc;
  const metrics = data.metrics || [];
  const primary = data.primary || {};
  if (data.name) $("devName").textContent = data.name;

  // --- Заряд ---
  const soc = primary.soc;
  if (soc && typeof soc.value === "number") {
    const p = Math.max(0, Math.min(100, soc.value));
    const lvl = socLevel(p);
    $("socNum").className = "pxwrap t-" + lvl;
    $("socNum").innerHTML = pixelText(Math.round(p) + "%", { scale: 6 });
    const fill = $("battFill");
    fill.style.width = p + "%";
    fill.className = "lvl-" + lvl;
  }

  const st = pxState(data.state);
  $("statePill").className = "state " + st.cls;
  $("statePill").innerHTML = pixelSprite(st.sprite, { scale:2 }) + " " + st.label;

  $("etaLine").innerHTML = etaText(data.eta);

  // Ёмкость и сопротивление
  const cap = metrics.find(m => m.role === "capacity" && m.cap_kind === "remaining")
           || metrics.find(m => m.code === "cap");
  const total = metrics.find(m => m.role === "capacity" && m.cap_kind === "total");
  const res = metrics.find(m => m.code === "resistance");
  let caps = "";
  if (cap) caps += `<span>${T("device.capRemain")} <b>${fmt(cap.value, cap.unit)}</b></span>`;
  if (total) caps += `<span>${T("device.capTotal")} <b>${fmt(total.value, total.unit)}</b></span>`;
  if (res) caps += `<span>${T("device.capRes")} <b>${fmt(res.value, res.unit)}</b></span>`;
  $("capLine").innerHTML = caps;

  // --- Живые показания ---
  const tiles = metrics.filter(m => m.group === "live" && !TILE_EXCLUDE.has(m.code));
  tiles.sort((a, b) => (TILE_PRIORITY.indexOf(a.code) + 1 || 99) - (TILE_PRIORITY.indexOf(b.code) + 1 || 99));
  $("tiles").innerHTML = tiles.map(tileHtml).join("");

  // --- Группы точек данных ---
  let gh = "";
  for (const g of GROUP_ORDER) {
    const items = metrics.filter(m => m.group === g);
    if (!items.length) continue;
    gh += `<h2 class="section label">${T("group." + g)}</h2><div class="px-box"><table><tbody>` +
      items.map(m => `<tr><td>${escapeHtml(BMI18n.dp(m.code, m.role))}</td>
        <td class="code">${escapeHtml(m.code)}</td>
        <td class="val">${fmt(m.value, m.unit)}</td></tr>`).join("") +
      `</tbody></table></div>`;
  }
  $("groups").innerHTML = gh;

  // --- График ---
  const src = primary.current || primary.power || primary.voltage;
  if (src && typeof src.value === "number") {
    chartMeta = { unit: src.unit, role: src.role,
      title: T(src.role === "current" ? "device.chartCurrent"
            : src.role === "power" ? "device.chartPower" : "device.chartVoltage") };
    if (fresh) {
      history.push({ t: data.timestamp, value: src.value });
      if (history.length > HISTORY_MAX) history.shift();
    }
    $("chartTitle").textContent = chartMeta.title;
    $("chartNow").textContent = fmt(src.value, src.unit);
    drawChart();
  }

  $("footer").textContent = T("common.updated", { time: fmtTime(data.timestamp) });
}

/* ------------------- График: ступенчатый «пиксельный» плот ------------------- */
const chart = $("chart");
const W = 900, H = 210, PAD_L = 54, PAD_R = 10, PAD_T = 12, PAD_B = 24, STEP = 3;
chart.setAttribute("viewBox", `0 0 ${W} ${H}`);
let chartPoints = [];

const snap = v => Math.round(v / STEP) * STEP;   // прижимаем всё к пиксельной сетке

function drawChart() {
  if (history.length < 2) { chart.innerHTML = ""; return; }
  const vals = history.map(p => p.value);
  let min = Math.min(...vals), max = Math.max(...vals);
  const signed = min < 0;
  if (signed) { min = Math.min(min, 0); max = Math.max(max, 0); }
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.12;
  min -= pad; max += pad;

  const n = history.length;
  const x = i => snap(PAD_L + (i / (n - 1)) * (W - PAD_L - PAD_R));
  const y = v => snap(PAD_T + (1 - (v - min) / (max - min)) * (H - PAD_T - PAD_B));
  chartPoints = history.map((p, i) => ({ x:x(i), y:y(p.value), v:p.value, t:p.t }));

  // Ступеньки: горизонталь до следующей точки, затем вертикаль — как на пиксельном плоттере.
  let d = `M ${chartPoints[0].x} ${chartPoints[0].y}`;
  for (let i = 1; i < n; i++) d += ` H ${chartPoints[i].x} V ${chartPoints[i].y}`;
  const baseY = signed ? y(0) : H - PAD_B;
  const area = `${d} V ${baseY} H ${chartPoints[0].x} Z`;

  let grid = "";
  [max, (max + min) / 2, min].forEach(tv => {
    const yy = y(tv);
    grid += `<line x1="${PAD_L}" x2="${W - PAD_R}" y1="${yy}" y2="${yy}"
      style="stroke:var(--edge)" stroke-width="2" stroke-dasharray="2 6"/>`;
    grid += `<text x="${PAD_L - 10}" y="${yy + 4}" text-anchor="end" style="fill:var(--dim)"
      font-size="11">${num(tv, 1)}</text>`;
  });
  const zero = signed ? `<line x1="${PAD_L}" x2="${W - PAD_R}" y1="${y(0)}" y2="${y(0)}"
      style="stroke:var(--edge)" stroke-width="2"/>` : "";

  const last = chartPoints[n - 1];
  chart.innerHTML = `
    <defs>
      <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
        <rect width="2" height="2" style="fill:var(--teal)" opacity=".30"/>
        <rect x="2" y="2" width="2" height="2" style="fill:var(--teal)" opacity=".30"/>
      </pattern>
    </defs>
    <g shape-rendering="crispEdges">
      ${grid}${zero}
      <path d="${area}" fill="url(#dither)" stroke="none"/>
      <path d="${d}" fill="none" style="stroke:var(--teal)" stroke-width="3"/>
      <rect x="${last.x - 3}" y="${last.y - 3}" width="6" height="6" style="fill:var(--teal)"/>
      <line id="crosshair" x1="0" x2="0" y1="${PAD_T}" y2="${H - PAD_B}" style="stroke:var(--dim)"
        stroke-width="2" stroke-dasharray="2 4" opacity="0"/>
      <rect id="hoverDot" width="6" height="6" style="fill:var(--amber)" opacity="0"/>
    </g>`;
}

const tooltip = $("tooltip");
function onMove(evt) {
  if (!chartPoints.length) return;
  const rect = chart.getBoundingClientRect();
  const px = (evt.clientX - rect.left) / rect.width * W;
  let best = chartPoints[0], bd = Infinity;
  for (const p of chartPoints) { const d = Math.abs(p.x - px); if (d < bd) { bd = d; best = p; } }
  const ch = $("crosshair"), hd = $("hoverDot");
  if (ch) { ch.setAttribute("x1", best.x); ch.setAttribute("x2", best.x); ch.setAttribute("opacity", 1); }
  if (hd) { hd.setAttribute("x", best.x - 3); hd.setAttribute("y", best.y - 3); hd.setAttribute("opacity", 1); }
  tooltip.style.opacity = 1;
  tooltip.style.left = (evt.clientX + 12) + "px";
  tooltip.style.top = (evt.clientY - 10) + "px";
  tooltip.innerHTML = `<b>${fmt(best.v, chartMeta.unit)}</b><br>
    <span class="t-dim">${fmtTime(best.t)}</span>`;
}
function onLeave() {
  tooltip.style.opacity = 0;
  const ch = $("crosshair"), hd = $("hoverDot");
  if (ch) ch.setAttribute("opacity", 0);
  if (hd) hd.setAttribute("opacity", 0);
}
chart.addEventListener("mousemove", onMove);
chart.addEventListener("mouseleave", onLeave);
chart.addEventListener("touchmove", e => { if (e.touches[0]) onMove(e.touches[0]); }, { passive:true });
chart.addEventListener("touchend", onLeave);

async function refresh() {
  try {
    const resp = await bmFetch("/api/status?device_id=" + encodeURIComponent(DEVICE_ID));
    const data = await resp.json();
    if (!resp.ok || data.error) setConn(false, data.error || `HTTP ${resp.status}`);
    else { setConn(true, null); lastData = data; render(data); }
  } catch (e) {
    setConn(false, T("device.unreachable", { msg: e.message }));
  }
}

async function tick() {
  try { await refresh(); } finally { setTimeout(tick, pollInterval * 1000); }
}

/* Сменили язык — перерисовываем последний ответ (без новой точки на графике)
   и перезапрашиваем конфиг: имя демо-устройства приходит с сервера. */
BMI18n.onChange(() => {
  setConn(conn.online, conn.err);
  if (lastData) render(lastData, false);
  loadConfig();
});

$("logo").innerHTML = pixelBattery(2);
$("socNum").innerHTML = pixelText("--%", { scale: 6 });
(async function init() { await loadConfig(); tick(); })();
</script>
</body>
</html>
